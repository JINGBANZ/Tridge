name: TestFlight

# Manual release: trigger from the Actions tab → "TestFlight" → "Run workflow".
# Kept off push/PR on purpose — every run creates a real TestFlight build, so it
# should be a deliberate act, not automatic. (Add a `push: tags: ['v*']` trigger
# later if you want tag-driven releases.)
on:
  workflow_dispatch:

jobs:
  testflight:
    name: build + upload to TestFlight
    # macos-26's default Xcode is 26.x (iOS 26 SDK). Apple rejects App Store /
    # TestFlight uploads built with an older SDK, so macos-15 (Xcode 16 / iOS 18
    # SDK) can't be used for the release build.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Fail early with actionable guidance if the release secrets are missing,
      # rather than deep inside a fastlane stack trace.
      - name: Check release secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPMENT_CERT_P12: ${{ secrets.APPLE_DEVELOPMENT_CERT_P12 }}
          APPLE_DEVELOPMENT_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERT_PASSWORD }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID APPLE_DEVELOPMENT_CERT_P12 APPLE_DEVELOPMENT_CERT_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — see README → 'On your iPhone (TestFlight)'."
            exit 1
          fi

      - uses: ruby/setup-ruby@v1
        with:
          # Pinned explicitly: setup-ruby errors without a version when the repo
          # has no .ruby-version/.tool-versions file. 3.3 is a current fastlane-
          # supported Ruby with prebuilt macOS binaries.
          ruby-version: "3.3"
          bundler-cache: true

      # Decode the App Store Connect API key (.p8) to a file so xcodebuild can use
      # it for cloud-managed signing (-authenticationKeyPath). openssl is used for
      # a base64 decode that tolerates both wrapped and single-line secrets.
      - name: Decode App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" | openssl base64 -A -d > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # Reuse one Apple Development identity across ephemeral runners. Without
      # this, automatic signing creates a new certificate on every release and
      # eventually exhausts the Apple Developer account's certificate quota.
      - name: Install Apple Development certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPMENT_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERT_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/apple-development.p12"
          keychain_path="$RUNNER_TEMP/tridge-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"

          printf '%s' "$CERTIFICATE_P12" | openssl base64 -A -d > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db

          identity_count="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Apple Development/ { count++ } END { print count+0 }')"
          if [ "$identity_count" -lt 1 ]; then
            echo "::error::APPLE_DEVELOPMENT_CERT_P12 contains no usable Apple Development signing identity."
            exit 1
          fi

      # No scan-API secret to write: the app authenticates to the worker with
      # Apple App Attest, whose keys are generated on-device at runtime.

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta
