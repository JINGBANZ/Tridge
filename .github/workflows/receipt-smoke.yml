name: Receipt smoke test

# Live LLM integration test — costs real (tiny) API money, so it never runs
# automatically. Trigger from the Actions tab; needs the OPENAI_API_KEY secret.
on:
  workflow_dispatch:

jobs:
  smoke:
    name: fixtures → OpenAI → expected inventory
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run live receipt smoke tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not configured"; exit 1
          fi
          swift test --filter ReceiptScanSmokeTests
