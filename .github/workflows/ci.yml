name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-tests:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  server-tests:
    name: worker typecheck + tests (server/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Deploys are NOT done here: the worker deploys via Cloudflare Workers Builds
  # (the platform's recommended git integration) on pushes to main that touch
  # server/ — see server/README.md → Deploy. CI's job is only to gate PRs.

  ios-build:
    name: build + tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Full logic test suite
        run: swift test
      # The app authenticates to the scan worker with Apple App Attest, which
      # needs no build-time secret (and can't run on the Simulator anyway).
      # Debug on purpose: keeps the DEBUG-only "Try sample receipt" path in test builds.
      - name: Build for iOS Simulator
        run: >
          xcodebuild
          -project Tridge.xcodeproj
          -scheme Tridge
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath build
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO
      - name: Zip simulator app (Appetize.io upload format)
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r -y "$GITHUB_WORKSPACE/Tridge-sim.zip" Tridge.app
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Tridge-simulator
          path: Tridge-sim.zip

  # Each PR gets its own Appetize app so changes are viewable before merging to
  # main. The app is tagged with the PR number via Appetize's `note` field, so
  # re-pushes update the same app; appetize-cleanup.yml deletes it on PR close.
  appetize-preview:
    name: PR preview on Appetize.io
    needs: ios-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
    steps:
      - name: Skip (no APPETIZE_API_TOKEN secret configured)
        if: env.APPETIZE_API_TOKEN == ''
        run: echo "APPETIZE_API_TOKEN secret not set — skipping PR preview."
      - uses: actions/download-artifact@v4
        if: env.APPETIZE_API_TOKEN != ''
        with:
          name: Tridge-simulator
      - name: Upload PR build to Appetize
        if: env.APPETIZE_API_TOKEN != ''
        id: upload
        env:
          NOTE: gh-pr-${{ github.event.pull_request.number }}
        run: |
          key=$(curl --fail -sS -u "${APPETIZE_API_TOKEN}:" "https://api.appetize.io/v1/apps" \
            | python3 -c '
          import json, os, sys
          j = json.load(sys.stdin)
          apps = j.get("data", []) if isinstance(j, dict) else j
          print(next((a["publicKey"] for a in apps if a.get("note") == os.environ["NOTE"]), ""))')
          url="https://api.appetize.io/v1/apps${key:+/$key}"
          curl --fail-with-body -sS -u "${APPETIZE_API_TOKEN}:" "$url" \
            -F "file=@Tridge-sim.zip" \
            -F "platform=ios" \
            -F "note=${NOTE}" \
            -o response.json
          echo "publicKey=$(python3 -c 'import json;print(json.load(open("response.json"))["publicKey"])')" >> "$GITHUB_OUTPUT"
      - name: Comment preview link on PR
        if: env.APPETIZE_API_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.upload.outputs.publicKey }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- appetize-pr-preview -->"
          body="${marker}
          ### 📱 Appetize preview

          **https://appetize.io/app/${KEY}** — updated for ${SHA}.

          Sessions start from a clean device — no setup needed: tap the scan button for \"Try sample receipt\", or \"Seed the App\" to fill the fridge instantly. (Live scanning needs Apple App Attest, which runs only on a real device — use a TestFlight build.)"
          cid=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id // empty")
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${cid}" -f body="$body" --silent
          else
            gh api "repos/${{ github.repository }}/issues/${PR}/comments" -f body="$body" --silent
          fi
