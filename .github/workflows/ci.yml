name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-tests:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  server-tests:
    name: worker typecheck + tests (server/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Deploys are NOT done here: the worker deploys via Cloudflare Workers Builds
  # (the platform's recommended git integration) on pushes to main that touch
  # server/ — see server/README.md → Deploy. CI's job is only to gate PRs.

  release-config:
    name: release config syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ruby -c fastlane/Fastfile

  ios-build:
    name: build + tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Full logic test suite
        run: swift test
      # The app authenticates to the scan worker with Apple App Attest, which
      # needs no build-time secret (and can't run on the Simulator anyway).
      # Debug on purpose: keeps the DEBUG-only "Try sample receipt" path in test builds.
      - name: Build for iOS Simulator
        run: >
          xcodebuild
          -project Tridge.xcodeproj
          -scheme Tridge
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath build
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO
